<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO-FOR-GOLD | Member Gateway</title>

    <!-- Memberstack Script -->
    <script
        data-memberstack-app="app_cmr37utu300er0tsx1urlei2t"
        src="https://static.memberstack.com/scripts/v2/memberstack.js"
        type="text/javascript">
    </script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --gold: #c5a059;
            --dark-bg: #0f0f0f;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #0f0f0f 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ==============================
           LOGGED-OUT GATEWAY
        ============================== */

        .container {
            text-align: center;
            max-width: 400px;
            width: 90%;
            display: none;
        }

        .logo-container {
            margin-bottom: 40px;
        }

        .logo-image {
            max-width: 280px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .btn {
            background-color: var(--gold);
            color: #000;
            padding: 20px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 14px;
            display: block;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            background-color: #e2c07d;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
        }

        .forgot-link {
            display: inline-block;
            margin-top: 25px;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-link:hover {
            color: rgba(255,255,255,0.7);
        }

        /* ==============================
           GAMMA CLUB CONTENT
        ============================== */

        #member-content {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 100;
        }

        /* ==============================
           ACCOUNT CONTROLS
        ============================== */

        #account-controls {
            display: none;
            position: fixed;
            top: 0;
            right: 16px;
            z-index: 1000;
        }

        .account-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px 18px;

            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;

            cursor: pointer;
            transition: all 0.3s ease;
        }

        .account-btn:hover {
            background: #e2c07d;
        }

        .logout-btn {
            background: #1a1a1a;
            color: var(--gold);
            border-left: 1px solid var(--gold);
        }

        .logout-btn:hover {
            background: #2a2a2a;
        }

        /* ==============================
           LOADING SCREEN
        ============================== */

        #loading-screen {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }

        /* Hide Memberstack modal logo */
        #msOverlay [data-element="modal-logo"] {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- ==============================
         1. LOADING SCREEN
    ============================== -->

    <div id="loading-screen">
        VERIFYING ACCESS...
    </div>


    <!-- ==============================
         2. LOGGED-OUT GATEWAY
    ============================== -->

    <div class="container" id="gateway-ui">

        <div class="logo-container">
            <img
                src="GO-FOR-GOLD%20CLUB%20LOGO.png"
                alt="GO-FOR-GOLD CLUB"
                class="logo-image"
            >
        </div>

        <!-- Login -->
        <button
            data-ms-modal="login"
            class="btn"
        >
            Member Access
        </button>

        <!-- Forgot / Reset Password -->
        <a
            data-ms-modal="forgot-password"
            class="forgot-link"
        >
            Change / Reset Password
        </a>

    </div>


    <!-- ==============================
         3. GAMMA CLUB CONTENT
    ============================== -->

    <iframe
        id="member-content"
        src="https://landing-page-8yan0s4.gamma.site/"
    ></iframe>


    <!-- ==============================
         4. LOGGED-IN ACCOUNT CONTROLS
    ============================== -->

    <div id="account-controls">

        <!-- Change Password -->
        <button
            data-ms-modal="profile"
            data-ms-modal-tab="changePassword"
            class="account-btn"
        >
            Change Password
        </button>

        <!-- Log Out -->
        <button
            data-ms-action="logout"
            class="account-btn logout-btn"
        >
            Log Out
        </button>

    </div>


    <!-- ==============================
         5. MEMBERSTACK LOGIN STATE
    ============================== -->

    <script>

        window.$memberstackDom.getCurrentMember()
        .then(({ data: member }) => {

            const loadingScreen =
                document.getElementById('loading-screen');

            const gatewayUi =
                document.getElementById('gateway-ui');

            const memberContent =
                document.getElementById('member-content');

            const accountControls =
                document.getElementById('account-controls');


            if (member) {

                // =========================
                // MEMBER IS LOGGED IN
                // =========================

                loadingScreen.style.display = 'none';

                gatewayUi.style.display = 'none';

                memberContent.style.display = 'block';

                accountControls.style.display = 'flex';


            } else {

                // =========================
                // MEMBER IS LOGGED OUT
                // =========================

                loadingScreen.style.display = 'none';

                gatewayUi.style.display = 'block';

                memberContent.style.display = 'none';

                accountControls.style.display = 'none';

            }

        })

        .catch((error) => {

            console.error('Memberstack error:', error);

            // If Memberstack fails,
            // show the login gateway rather than the protected content.

            document.getElementById('loading-screen')
                .style.display = 'none';

            document.getElementById('gateway-ui')
                .style.display = 'block';

            document.getElementById('member-content')
                .style.display = 'none';

            document.getElementById('account-controls')
                .style.display = 'none';

        });

    </script>

</body>
</html>
